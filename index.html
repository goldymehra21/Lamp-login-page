<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Dark Overlay -->
    <div class="darkness"></div>

    <!-- Lamp -->
    <div class="lamp-area">

        <div class="wire"></div>

        <div class="lamp">
            <div class="light"></div>
        </div>

        <!-- Pull Chain -->
        <div class="chain" id="chain">
            <div class="rope"></div>
            <div class="ring"></div>
        </div>

    </div>

    <!-- Login Card -->
    <div class="login-box" id="loginBox">

        <h1>Welcome Back</h1>

        <p>Sign in to continue</p>

        <form>

            <input
                type="text"
                placeholder="Username"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
